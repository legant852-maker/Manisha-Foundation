<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Octagonal Ring Gold Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#eed082" />
      <stop offset="35%" stopColor="#cfa148" />
      <stop offset="70%" stopColor="#e8c978" />
      <stop offset="100%" stopColor="#ab7b2b" />
    </linearGradient>
    <linearGradient id="innerGoldStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#b4822e" />
      <stop offset="50%" stopColor="#f5dd98" />
      <stop offset="100%" stopColor="#a37021" />
    </linearGradient>

    <!-- Shield Blue Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#2559a4" />
      <stop offset="100%" stopColor="#143468" />
    </linearGradient>

    <!-- Torch / Flame Gradient -->
    <linearGradient id="torchFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#e25d24" />
      <stop offset="50%" stopColor="#f9aa33" />
      <stop offset="100%" stopColor="#ffffff" />
    </linearGradient>

    <!-- Wreath Branch Gradient -->
    <linearGradient id="wreathGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#1e3f7a" />
      <stop offset="100%" stopColor="#10254c" />
    </linearGradient>

    <!-- Left Figure / Heart Wing: Pink / Magenta / Maroon -->
    <linearGradient id="pinkFigureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#d83a84" />
      <stop offset="45%" stopColor="#b71c66" />
      <stop offset="100%" stopColor="#87104b" />
    </linearGradient>

    <!-- Right Figure / Heart Wing: Orange / Saffron -->
    <linearGradient id="orangeFigureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f79433" />
      <stop offset="50%" stopColor="#ea6119" />
      <stop offset="100%" stopColor="#c43f07" />
    </linearGradient>

    <!-- Ribbon Center Drop / Loop Gradient -->
    <linearGradient id="ribbonLoopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#b71c66" />
      <stop offset="60%" stopColor="#db468e" />
      <stop offset="100%" stopColor="#ea6119" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Circular Base White Card Background -->
  <circle cx="250" cy="250" r="246" fill="#ffffff" />

  <!-- Outer Faceted 16-Sided Golden Polygonal Border with Chamfered Corners -->
  <polygon
    points="
      155,10 345,10 440,60 490,155 490,345 440,440 345,490 155,490 60,440 10,345 10,155 60,60
    "
    fill="none"
    stroke="url(#goldGradient)"
    stroke-width="15"
    stroke-linejoin="round"
  />

  <!-- Inner Thin Golden Circle Accent -->
  <circle
    cx="250"
    cy="250"
    r="228"
    fill="none"
    stroke="url(#innerGoldStroke)"
    stroke-width="2.5"
  />

  <!-- Top Center Heraldic Shield & Wreath Assembly -->
  <g transform="translate(250, 115)" filter="url(#subtleShadow)">
    <!-- Wreath Leaves (Left Side) -->
    <g fill="url(#wreathGrad)">
      <path d="M -45,-38 C -55,-48 -68,-40 -64,-28 C -58,-28 -50,-32 -45,-38 Z" />
      <path d="M -54,-20 C -66,-28 -76,-16 -70,-6 C -62,-8 -56,-14 -54,-20 Z" />
      <path d="M -58,0 C -72,-5 -78,12 -68,20 C -62,14 -58,6 -58,0 Z" />
      <path d="M -55,22 C -68,22 -70,38 -58,45 C -54,36 -52,28 -55,22 Z" />
      <path d="M -44,42 C -54,48 -50,64 -38,66 C -38,56 -40,48 -44,42 Z" />
      <path d="M -28,58 C -36,68 -28,80 -18,78 C -20,68 -24,62 -28,58 Z" />
      <path d="M -18,76 C -36,65 -55,35 -50,-30 C -48,-32 -46,-30 -47,-25 C -50,30 -32,58 -16,72 Z" />
    </g>

    <!-- Wreath Leaves (Right Side) -->
    <g fill="url(#wreathGrad)">
      <path d="M 45,-38 C 55,-48 68,-40 64,-28 C 58,-28 50,-32 45,-38 Z" />
      <path d="M 54,-20 C 66,-28 76,-16 70,-6 C 62,-8 56,-14 54,-20 Z" />
      <path d="M 58,0 C 72,-5 78,12 68,20 C 62,14 58,6 58,0 Z" />
      <path d="M 55,22 C 68,22 70,38 58,45 C 54,36 52,28 55,22 Z" />
      <path d="M 44,42 C 54,48 50,64 38,66 C 38,56 40,48 44,42 Z" />
      <path d="M 28,58 C 36,68 28,80 18,78 C 20,68 24,62 28,58 Z" />
      <path d="M 18,76 C 36,65 55,35 50,-30 C 48,-32 46,-30 47,-25 C 50,30 32,58 16,72 Z" />
    </g>

    <!-- The Classical Blue Shield -->
    <path
      d="M -42,-44 L 42,-44 C 42,-44 44,12 28,34 C 18,48 0,60 0,60 C 0,60 -18,48 -28,34 C -44,12 -42,-44 -42,-44 Z"
      fill="url(#shieldGrad)"
      stroke="#10254c"
      stroke-width="2.5"
    />

    <!-- Torch / Gyan Jyoti inside Shield -->
    <g transform="translate(0, -6)">
      <path
        d="M 0,-26 C 6,-18 7,-10 0,0 C -7,-10 -6,-18 0,-26 Z"
        fill="url(#torchFlame)"
      />
      <path
        d="M 0,-20 C 3,-14 3,-8 0,-2 C -3,-8 -3,-14 0,-20 Z"
        fill="#ffffff"
        opacity="0.9"
      />
      <path d="M -3,0 L 3,0 L 2,12 L -2,12 Z" fill="#ffffff" />
      <polygon points="-7,1 -2,-3 2,-3 7,1" fill="#f8fafc" />
      <path
        d="M -20,13 C -10,8 -2,10 0,14 C 2,10 10,8 20,13 L 20,22 C 10,18 2,20 0,23 C -2,20 -10,18 -20,22 Z"
        fill="#ffffff"
        stroke="#1a365d"
        stroke-width="1.2"
      />
      <circle cx="0" cy="19" r="3.2" fill="#7c3aed" stroke="#ffffff" stroke-width="0.8" />
    </g>
  </g>

  <!-- Central Intertwined Heart / Awareness Ribbon Figures -->
  <g transform="translate(250, 230)" filter="url(#subtleShadow)">
    <circle cx="-68" cy="-56" r="16.5" fill="url(#pinkFigureGrad)" />
    <circle cx="68" cy="-56" r="16.5" fill="url(#orangeFigureGrad)" />

    <path
      d="
        M -68,-36
        C -110,-12 -115,45 -85,82
        C -65,108 -32,132 -2,148
        C -14,124 -24,96 -18,65
        C -12,34 -38,8 -58,-12
        C -66,-20 -68,-30 -68,-36 Z
      "
      fill="url(#pinkFigureGrad)"
    />

    <path
      d="
        M 68,-36
        C 110,-12 115,45 85,82
        C 65,108 32,132 2,148
        C 14,124 24,96 18,65
        C 12,34 38,8 58,-12
        C 66,-20 68,-30 68,-36 Z
      "
      fill="url(#orangeFigureGrad)"
    />

    <path
      d="
        M 0,28
        C -16,42 -26,62 -22,86
        C -18,108 0,132 0,148
        C 0,132 18,108 22,86
        C 26,62 16,42 0,28 Z
      "
      fill="none"
      stroke="url(#ribbonLoopGrad)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <ellipse cx="0" cy="74" rx="10" ry="17" fill="#ffffff" />
  </g>

  <!-- Sanskrit Motivational Inscription Ribbon Banner -->
  <g transform="translate(250, 312)">
    <rect x="-65" y="-10" width="130" height="20" rx="3" fill="#ffffff" opacity="0.95" />
    <text
      x="0"
      y="4"
      fill="#1e293b"
      font-size="11.5"
      font-weight="700"
      text-anchor="middle"
      font-family="'Mukta', 'Noto Sans Devanagari', sans-serif"
      letter-spacing="0.5"
    >
      तमसो मा ज्योतिर्गमय
    </text>
  </g>

  <!-- Main Marathi Title Typography: Red (कै.सौ. मनिषा सामाजिक व शैक्षणिक) -->
  <text
    x="250"
    y="370"
    fill="#b91c1c"
    font-size="24.5"
    font-weight="900"
    text-anchor="middle"
    font-family="'Mukta', 'Noto Sans Devanagari', sans-serif"
    letter-spacing="0.2"
  >
    कै.सौ. मनिषा सामाजिक व शैक्षणिक
  </text>

  <!-- Subtitle Line: Red (संस्था, नाशिक.) -->
  <text
    x="250"
    y="405"
    fill="#b91c1c"
    font-size="24"
    font-weight="900"
    text-anchor="middle"
    font-family="'Mukta', 'Noto Sans Devanagari', sans-serif"
    letter-spacing="0.5"
  >
    संस्था, नाशिक.
  </text>

  <!-- Registration Number (Primary Bold Black) -->
  <text
    x="250"
    y="436"
    fill="#0f172a"
    font-size="19"
    font-weight="800"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', system-ui, sans-serif"
    letter-spacing="0.5"
  >
    Reg No: F-0021881 (NSK)
  </text>

  <!-- Secondary Registration Number: Marathi -->
  <text
    x="250"
    y="460"
    fill="#0f172a"
    font-size="15.5"
    font-weight="800"
    text-anchor="middle"
    font-family="'Mukta', 'Noto Sans Devanagari', sans-serif"
    letter-spacing="0.4"
  >
    नोंदणी क्र.नाशिक/००००२३९/२०२२
  </text>

  <!-- Foundation Motto -->
  <text
    x="250"
    y="480"
    fill="#1e3a8a"
    font-size="9.8"
    font-weight="700"
    font-style="italic"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', system-ui, sans-serif"
  >
    The Goal is the Social and Educational Development of the last man in the society.
  </text>
</svg>
